name: Build RAX120v2 Openwrt

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      # ------------------------------------------------------------------
      # Create the big disk FIRST (Before downloading code)
      # ------------------------------------------------------------------
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Check Free Space
        run: df -h

      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: verify files
        run: ls -la

      # Install OpenWrt Build Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget time

      # Run build script
      - name: Run build.sh
        run: |
          chmod +x build.sh
          # Run the script and fail if it errors out
          ./build.sh

      # Filter only RAX120v2 files
      - name: Organize Release Artifacts
        run: |
          mkdir -p release_binaries
          # Find any file containing 'netgear_rax120v2' in the targets folder and copy it
          find bin/targets/ -name "*netgear_rax120v2*" -exec cp {} release_binaries/ \;
          
          # List files to verify (for logs)
          echo "The following files will be zipped:"
          ls -lh release_binaries/

      # Upload only the filtered folder
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_RAX120v2_Compiled
          path: release_binaries/
          if-no-files-found: error