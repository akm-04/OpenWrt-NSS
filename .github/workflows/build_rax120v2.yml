name: Build RAX120v2 Firmware

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04 

    steps:
      # Checkout your code
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      # Install OpenWrt Build Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget time

      # Run build script
      - name: Run build.sh
        run: |
          chmod +x build.sh
          # Run the script and fail if it errors out
          ./build.sh

      # Prepare the Artifacts
      - name: Verify Output
        run: |
          ls -R bin/

      # Upload the Firmware
      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rax120v2_OpenWrt_compiled
          path: bin/targets/       # Uploads only the relevant output folder
          if-no-files-found: error
